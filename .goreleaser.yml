before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    #binary: rabbitmq_exporter-{{.Version}}.{{.Target}}
    targets:
    - linux_amd64
    - linux_arm64
    - linux_arm_6
    - linux_arm_7
    - windows_amd64
    - darwin_amd64
    - darwin_arm64
    tags: netgo staticbuild
    ldflags: 
      -  -X main.Version={{.Version}}
      -  -X main.Revision={{.ShortCommit}}
      -  -X main.Branch={{.Branch}}
      -  -X main.BuildDate={{.CommitDate}}
checksum:
  name_template: 'checksums.txt'
changelog:
  use: github-native
release:
  discussion_category_name: Announcements
  footer: |
    ## Docker images

    - `docker pull ghcr.io/yoelpadronglez/rabbitmq_exporter:{{.Version}}`
    - `docker pull ghcr.io/yoelpadronglez/rabbitmq_exporter:{{.ShortCommit}}`
    - `docker pull yoelpadronglez/rabbitmq-exporter:{{.Version}}`
    - `docker pull yoelpadronglez/rabbitmq-exporter:{{.ShortCommit}}`

dockers:
- goos: linux
  goarch: amd64
  image_templates:
    - "yoelpadronglez/rabbitmq-exporter:linux-amd64-{{.ShortCommit}}"
    - "ghcr.io/yoelpadronglez/rabbitmq_exporter:linux-amd64-{{.ShortCommit}}"
  use: buildx
  build_flag_templates:
  - "--label=org.opencontainers.image.created={{.Date}}"
  - "--label=org.opencontainers.image.title={{.ProjectName}}"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}"
  - "--label=org.opencontainers.image.source=https://github.com/yoelpadronglez/rabbitmq_exporter"
  - "--platform=linux/amd64"

- goos: linux
  goarch: arm
  goarm: "6"
  image_templates:
  - "yoelpadronglez/rabbitmq-exporter:linux-arm6-{{.ShortCommit}}"
  - "ghcr.io/yoelpadronglez/rabbitmq_exporter:linux-arm6-{{.ShortCommit}}"
  use: buildx
  build_flag_templates:
  - "--label=org.opencontainers.image.created={{.Date}}"
  - "--label=org.opencontainers.image.title={{.ProjectName}}"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}"
  - "--label=org.opencontainers.image.source=https://github.com/yoelpadronglez/rabbitmq_exporter"
  - "--platform=linux/arm/v6"

- goos: linux
  goarch: arm
  goarm: "7"
  image_templates:
  - "yoelpadronglez/rabbitmq-exporter:linux-arm7-{{.ShortCommit}}"
  - "ghcr.io/yoelpadronglez/rabbitmq_exporter:linux-arm7-{{.ShortCommit}}"
  use: buildx
  build_flag_templates:
  - "--label=org.opencontainers.image.created={{.Date}}"
  - "--label=org.opencontainers.image.title={{.ProjectName}}"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}"
  - "--label=org.opencontainers.image.source=https://github.com/yoelpadronglez/rabbitmq_exporter"
  - "--platform=linux/arm/v7"

- goos: linux
  goarch: arm64
  image_templates:
  - "yoelpadronglez/rabbitmq-exporter:linux-arm64-{{.ShortCommit}}"
  - "ghcr.io/yoelpadronglez/rabbitmq_exporter:linux-arm64-{{.ShortCommit}}"
  use: buildx
  build_flag_templates:
  - "--label=org.opencontainers.image.created={{.Date}}"
